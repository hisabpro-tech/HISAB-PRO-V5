<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HISAB PRO V5</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
   .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
   .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
   .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
   .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
   .nav-links::-webkit-scrollbar{display:none}
   .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
   .nav-link:hover{background:#15803d;color:#fff}
   .nav-link.active{background:#15803d;color:#fff}
   .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
   .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .welcome-card{background:linear-gradient(135deg,#16a34a 0%,#15803d 100%);color:#fff;padding:24px;border-radius:12px;margin-bottom:20px}
    .welcome-card h2{font-size:24px;margin-bottom:8px}
    .welcome-card p{opacity:0.9;font-size:14px}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .stat-label{font-size:14px;color:#666;margin-bottom:8px}
    .stat-value{font-size:36px;font-weight:700;color:#1f2937}
    .stat-value.green{color:#16a34a}
    .stat-value.red{color:#dc2626}
    .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
    .card h3{font-size:18px;margin-bottom:16px}
    .chart-container{position:relative;height:350px;margin-top:16px}
   @media (max-width:768px){
     .nav-container{padding:0 8px}
     .nav-brand{font-size:16px;padding:10px 0}
     .nav-links{width:100%;order:3;padding-bottom:4px}
     .nav-link{padding:12px 10px;font-size:13px}
     .btn-logout{padding:6px 10px;font-size:12px}
     .welcome-card{padding:20px}
     .welcome-card h2{font-size:20px}
     .card{padding:16px}
     .stat-value{font-size:32px}
     .chart-container{height:280px}
   }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link active">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="welcome-card">
      <h2>Welcome Back! 👋</h2>
      <p id="welcomeText">Your business dashboard</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Sale</div>
        <div class="stat-value" id="totalSale">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Collection</div>
        <div class="stat-value green" id="totalCollection">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Udhar</div>
        <div class="stat-value red" id="totalUdhar">₹0</div>
      </div>
    </div>

    <div class="card">
      <h3>📊 Last 7 Days Performance</h3>
      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let salesChart = null

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        document.getElementById('welcomeText').innerText = `Logged in as ${session.user.email}`
        loadDashboard()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      document.getElementById('welcomeText').innerText = `Logged in as ${session.user.email}`
      loadDashboard()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    async function loadDashboard() {
      if (!currentSession) return

      const { data: allInvoices } = await supabase
        .from('invoices')
        .select('total_amount, amount_paid, balance_due, date')
        .eq('user_id', currentSession.user.id)

      const totalSale = allInvoices?.reduce((sum, inv) => sum + Number(inv.total_amount), 0) || 0
      const totalCollection = allInvoices?.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0) || 0
      const totalUdhar = allInvoices?.reduce((sum, inv) => sum + Number(inv.balance_due || 0), 0) || 0

      document.getElementById('totalSale').innerText = `₹${totalSale.toLocaleString('en-IN')}`
      document.getElementById('totalCollection').innerText = `₹${totalCollection.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`

      renderChart(allInvoices || [])
    }

    function renderChart(invoices) {
      const ctx = document.getElementById('salesChart')
      
      const last7Days = []
      const labels = []
      const salesData = []
      const collectionData = []
      const udharData = []

      for (let i = 6; i >= 0; i--) {
        const date = new Date()
        date.setDate(date.getDate() - i)
        date.setHours(0, 0, 0, 0)
        last7Days.push(date)
        labels.push(date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }))
      }

      last7Days.forEach(day => {
        const dayInvoices = invoices.filter(inv => {
          const invDate = new Date(inv.date)
          invDate.setHours(0, 0, 0, 0)
          return invDate.getTime() === day.getTime()
        })

        const daySale = dayInvoices.reduce((sum, inv) => sum + Number(inv.total_amount), 0)
        const dayCollection = dayInvoices.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0)
        const dayUdhar = dayInvoices.reduce((sum, inv) => sum + Number(inv.balance_due || 0), 0)

        salesData.push(daySale)
        collectionData.push(dayCollection)
        udharData.push(dayUdhar)
      })

      if (salesChart) salesChart.destroy()

      salesChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Sale',
              data: salesData,
              borderColor: '#16a34a',
              backgroundColor: 'rgba(22, 163, 74, 0.1)',
              tension: 0.4,
              fill: true
            },
            {
              label: 'Collection',
              data: collectionData,
              borderColor: '#0ea5e9',
              backgroundColor: 'rgba(14, 165, 233, 0.1)',
              tension: 0.4,
              fill: true
            },
            {
              label: 'Udhar',
              data: udharData,
              borderColor: '#dc2626',
              backgroundColor: 'rgba(220, 38, 38, 0.1)',
              tension: 0.4,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top'
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ₹' + context.parsed.y.toLocaleString('en-IN')
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return '₹' + value.toLocaleString('en-IN')
                }
              }
            }
          }
        }
      })
    }

    initApp()
  </script>
</body>
</html>
