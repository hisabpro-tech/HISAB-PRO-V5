<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HISAB PRO V5</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
   .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
   .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
   .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
   .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
   .nav-links::-webkit-scrollbar{display:none}
   .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
   .nav-link:hover{background:#15803d;color:#fff}
   .nav-link.active{background:#15803d;color:#fff}
   .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
   .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
   .container{max-width:1200px;margin:0 auto;padding:20px 16px}
   .welcome-card{background:#16a34a;color:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
   .welcome-card h2{font-size:20px;margin-bottom:4px}
   .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:24px}
   .stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
   .stat-label{font-size:13px;color:#6b7280;margin-bottom:8px}
   .stat-value{font-size:28px;font-weight:700;color:#111827}
   .stat-value.green{color:#16a34a}
   .stat-value.red{color:#dc2626}
   .chart-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
   .chart-card h3{font-size:18px;margin-bottom:20px}
    @media (max-width:768px){
     .nav-container{padding:0 8px}
     .nav-brand{font-size:16px;padding:10px 0}
     .nav-links{width:100%;order:3;padding-bottom:4px}
     .nav-link{padding:12px 10px;font-size:13px}
     .btn-logout{padding:6px 10px;font-size:12px}
     .stats-grid{grid-template-columns:1fr}
     .stat-value{font-size:24px}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link active">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="welcome-card">
      <h2>Welcome Back! 👋</h2>
      <p>Logged in as <span id="userEmailWelcome"></span></p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Today's Sale</div>
        <div class="stat-value" id="todaySale">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Collection</div>
        <div class="stat-value green" id="todayCollection">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Udhar</div>
        <div class="stat-value red" id="todayUdhar">₹0</div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Last 7 Days Performance</h3>
      <div id="salesChart"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let salesChart = null

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        document.getElementById('userEmailWelcome').innerText = session.user.email
        loadDashboard()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      document.getElementById('userEmailWelcome').innerText = session.user.email
      loadDashboard()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    async function loadDashboard() {
      const today = new Date().toISOString().split('T')[0]

      // 1. Today's Stats - Ye har din automatically reset hoga
      const { data: todayInvoices } = await supabase
       .from('invoices')
       .select('total_amount,amount_paid,balance_due')
       .eq('user_id', currentSession.user.id)
       .eq('date', today)

      let todaySale = 0, todayCollection = 0, todayUdhar = 0
      if (todayInvoices) {
        todayInvoices.forEach(inv => {
          todaySale += inv.total_amount
          todayCollection += inv.amount_paid
          todayUdhar += inv.balance_due
        })
      }

      document.getElementById('todaySale').innerText = `₹${todaySale.toLocaleString('en-IN')}`
      document.getElementById('todayCollection').innerText = `₹${todayCollection.toLocaleString('en-IN')}`
      document.getElementById('todayUdhar').innerText = `₹${todayUdhar.toLocaleString('en-IN')}`

      // 2. Last 7 Days Data for Candlestick Chart
      const chartData = []
      for (let i = 6; i >= 0; i--) {
        const date = new Date()
        date.setDate(date.getDate() - i)
        const dateStr = date.toISOString().split('T')[0]

        const { data: dayInvoices } = await supabase
         .from('invoices')
         .select('total_amount,amount_paid')
         .eq('user_id', currentSession.user.id)
         .eq('date', dateStr)

        let daySale = 0, dayCollection = 0
        if (dayInvoices) {
          dayInvoices.forEach(inv => {
            daySale += inv.total_amount
            dayCollection += inv.amount_paid
          })
        }

        // Candlestick format: [Open, High, Low, Close]
        // Open=0, High=Sale, Low=Collection, Close=Sale
        chartData.push({
          x: new Date(dateStr).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
          y: [0, daySale, dayCollection, daySale]
        })
      }

      // 3. Render Candlestick Chart
      const options = {
        series: [{
          name: 'Sale vs Collection',
          data: chartData
        }],
        chart: {
          type: 'candlestick',
          height: 350,
          toolbar: { show: false }
        },
        title: {
          text: 'Daily Sale & Collection',
          align: 'left',
          style: { fontSize: '14px', fontWeight: 600 }
        },
        xaxis: { type: 'category' },
        yaxis: {
          labels: { formatter: (val) => `₹${val.toLocaleString('en-IN')}` }
        },
        plotOptions: {
          candlestick: {
            colors: { upward: '#16a34a', downward: '#dc2626' }
          }
        },
        tooltip: {
          y: { formatter: (val) => `₹${val.toLocaleString('en-IN')}` }
        }
      }

      if (salesChart) salesChart.destroy()
      salesChart = new ApexCharts(document.querySelector("#salesChart"), options)
      salesChart.render()
    }

    initApp()
  </script>
</body>
</html>
