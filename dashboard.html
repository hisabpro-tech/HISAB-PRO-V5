<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HISAB PRO V5</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.nav-brand{color:#fff;font-size:20px;font-weight:700;padding:16px 0}.nav-links{display:flex;gap:4px}.nav-link{color:#d1fae5;text-decoration:none;padding:18px 16px;display:block;font-weight:500;font-size:15px;transition:all.2s}.nav-link:hover{background:#15803d;color:#fff}.nav-link.active{background:#15803d;color:#fff}.nav-user{display:flex;align-items:center;gap:12px}#userEmail{color:#d1fae5;font-size:14px}.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}.container{max-width:1200px;margin:0 auto;padding:20px 16px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:24px}.stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.stat-label{font-size:14px;color:#666;margin-bottom:8px}.stat-value{font-size:28px;font-weight:700;color:#1f2937}.stat-value.green{color:#16a34a}.stat-value.red{color:#dc2626}.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}.card h3{margin-bottom:16px;font-size:18px}.btn{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-block}.btn:hover{background:#15803d}.chart-container{position:relative;height:300px;margin-top:16px}@media (max-width:768px){.nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#16a34a;flex-direction:column}.nav-links.show{display:flex}.menu-toggle{display:block}#userEmail{display:none}.chart-container{height:250px}}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div style="display:flex;align-items:center;gap:16px">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-brand">HISAB PRO V5</div>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/dashboard.html" class="nav-link active">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Today's Sale</div>
        <div class="stat-value" id="todaySale">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Collection</div>
        <div class="stat-value green" id="todayCollection">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Udhar Pending</div>
        <div class="stat-value red" id="totalUdhar">₹0</div>
      </div>
    </div>

    <div class="card">
      <h3>Quick Actions</h3>
      <a href="/invoice.html" class="btn">+ New Invoice</a>
    </div>

    <div class="card">
      <h3>Last 7 Days Performance</h3>
      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://kczpfgpfnkopdsdfkgde.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjenBmZ3BmbmtvcGRzZGZrZ2RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDQ1MTMsImV4cCI6MjA5NTI4MDUxM30.yz6SAi7LA2XfRcJN1ssCN0tCzkcP5pWKo8tN0OV_QAc'
    )

    const { data: { session } } = await supabase.auth.getSession()
    if (!session) window.location.replace('/login.html')
    if (session?.user?.email) {
      document.getElementById('userEmail').innerText = session.user.email
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('menuToggle').onclick = () => {
      document.getElementById('navLinks').classList.toggle('show')
    }

    async function loadDashboard() {
      const today = new Date().toISOString().split('T')[0]

      const { data: todayInvoices } = await supabase
   .from('invoices')
   .select('total_amount, amount_paid')
   .eq('user_id', session.user.id)
   .gte('date', today)
   .lt('date', today + 'T23:59:59')

      const todaySale = todayInvoices?.reduce((sum, inv) => sum + Number(inv.total_amount), 0) || 0
      const todayCollection = todayInvoices?.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0) || 0

      document.getElementById('todaySale').innerText = `₹${todaySale.toLocaleString('en-IN')}`
      document.getElementById('todayCollection').innerText = `₹${todayCollection.toLocaleString('en-IN')}`

      const { data: udharInvoices } = await supabase
   .from('invoices')
   .select('balance_due')
   .eq('user_id', session.user.id)
   .gt('balance_due', 0)

      const totalUdhar = udharInvoices?.reduce((sum, inv) => sum + Number(inv.balance_due), 0) || 0
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`

      loadChart()
    }

    async function loadChart() {
      const labels = []
      const salesData = []
      const collectionData = []

      for (let i = 6; i >= 0; i--) {
        const date = new Date()
        date.setDate(date.getDate() - i)
        const dateStr = date.toISOString().split('T')[0]
        labels.push(date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }))

        const { data: dayInvoices } = await supabase
     .from('invoices')
     .select('total_amount, amount_paid')
     .eq('user_id', session.user.id)
     .gte('date', dateStr)
     .lt('date', dateStr + 'T23:59:59')

        const daySale = dayInvoices?.reduce((sum, inv) => sum + Number(inv.total_amount), 0) || 0
        const dayCollection = dayInvoices?.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0) || 0

        salesData.push(daySale)
        collectionData.push(dayCollection)
      }

      const ctx = document.getElementById('salesChart')
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Sale',
              data: salesData,
              backgroundColor: '#3b82f6',
              borderRadius: 6
            },
            {
              label: 'Collection',
              data: collectionData,
              backgroundColor: '#16a34a',
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top' }
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: (value) => '₹' + value.toLocaleString('en-IN') } }
          }
        }
      })
    }

    loadDashboard()
  </script>
</body>
</html>
