<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
 .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
 .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
 .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
 .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .nav-links::-webkit-scrollbar{display:none}
 .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
 .nav-link:hover{background:#15803d;color:#fff}
 .nav-link.active{background:#15803d;color:#fff}
 .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
 .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
 .container{max-width:1200px;margin:0 auto;padding:20px 16px}
 .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
 .page-title{font-size:24px;font-weight:700}
 .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .filter-group{display:flex;gap:4px;background:#fff;padding:4px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 .filter-btn{padding:8px 14px;border:none;background:transparent;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;color:#6b7280;transition:all.2s}
 .filter-btn.active{background:#16a34a;color:#fff}
 .btn-export{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer}
 .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:24px}
 .stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #16a34a}
 .stat-card.udhar{border-left-color:#dc2626}
 .stat-label{font-size:13px;color:#6b7280;margin-bottom:8px}
 .stat-value{font-size:28px;font-weight:700;color:#111827}
 .stat-value.green{color:#16a34a}
 .stat-value.red{color:#dc2626}
 .table-wrapper{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#f9fafb;padding:14px 12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:2px solid #e5e7eb;white-space:nowrap}
  td{padding:14px 12px;border-bottom:1px solid #f3f4f6;font-size:14px}
  tr:last-child td{border-bottom:none}
  tr:hover{background:#f9fafb}
 .badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
 .badge-udhar{background:#fee2e2;color:#dc2626}
 .badge-cash{background:#dcfce7;color:#16a34a}
 .badge-upi{background:#dbeafe;color:#2563eb}
 .text-right{text-align:right}
 .amount{font-weight:600}
 .amount.red{color:#dc2626}
 .amount.green{color:#16a34a}
 .empty{padding:40px;text-align:center;color:#6b7280}
    @media (max-width:768px){
   .nav-container{padding:0 8px}
   .nav-brand{font-size:16px;padding:10px 0}
   .nav-links{width:100%;order:3;padding-bottom:4px}
   .nav-link{padding:12px 10px;font-size:13px}
   .btn-logout{padding:6px 10px;font-size:12px}
   .stats-grid{grid-template-columns:1fr 1fr}
   .stat-value{font-size:22px}
   .header-actions{width:100%}
   .filter-group{flex:1;overflow-x:auto}
   .filter-btn{padding:6px 10px;font-size:12px}
   th,td{padding:10px 8px;font-size:13px}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link active">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">All Invoices</h1>
      <div class="header-actions">
        <div class="filter-group">
          <button class="filter-btn" data-filter="today">Today</button>
          <button class="filter-btn" data-filter="week">This Week</button>
          <button class="filter-btn" data-filter="month">This Month</button>
          <button class="filter-btn active" data-filter="all">All Time</button>
        </div>
        <button class="btn-export" id="exportBtn">Export CSV</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Sales</div>
        <div class="stat-value" id="totalSales">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Paid</div>
        <div class="stat-value green" id="totalPaid">₹0</div>
      </div>
      <div class="stat-card udhar">
        <div class="stat-label">Total Udhar</div>
        <div class="stat-value red" id="totalUdhar">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Udhar Customers</div>
        <div class="stat-value" id="udharCount">0</div>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th class="text-right">Total</th>
            <th class="text-right">Paid</th>
            <th class="text-right">Balance</th>
            <th>Payment</th>
          </tr>
        </thead>
        <tbody id="invoiceList"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let allInvoices = []
    let currentFilter = 'all'

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadReports()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadReports()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        currentFilter = btn.dataset.filter
        applyFilter()
      }
    })

    document.getElementById('exportBtn').onclick = () => {
      const filtered = getFilteredInvoices()
      if (filtered.length === 0) return alert('No data to export')
      
      const csv = [
        ['Date','Customer','Total','Paid','Balance','Payment'].join(','),
        ...filtered.map(inv => [
          inv.date,
          `"${inv.customer_name}"`,
          inv.total_amount,
          inv.amount_paid,
          inv.balance_due,
          inv.payment_method || 'Udhar'
        ].join(','))
      ].join('\n')

      const blob = new Blob([csv], { type: 'text/csv' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `invoices_${currentFilter}_${new Date().toISOString().split('T')[0]}.csv`
      a.click()
      URL.revokeObjectURL(url)
    }

    async function loadReports() {
      const { data: invoices, error } = await supabase
   .from('invoices')
   .select('*')
   .eq('user_id', currentSession.user.id)
   .order('date', { ascending: false })

      if (error) return console.error(error)

      allInvoices = invoices || []
      applyFilter()
    }

    function getFilteredInvoices() {
      const today = new Date()
      today.setHours(0,0,0,0)

      if (currentFilter === 'all') return allInvoices

      return allInvoices.filter(inv => {
        const invDate = new Date(inv.date)
        invDate.setHours(0,0,0,0)

        if (currentFilter === 'today') {
          return invDate.getTime() === today.getTime()
        }

        if (currentFilter === 'week') {
          const weekStart = new Date(today)
          weekStart.setDate(today.getDate() - today.getDay())
          return invDate >= weekStart
        }

        if (currentFilter === 'month') {
          return invDate.getMonth() === today.getMonth() && 
                 invDate.getFullYear() === today.getFullYear()
        }

        return true
      })
    }

    function applyFilter() {
      const filtered = getFilteredInvoices()
      
      // Calculate stats for filtered data
      let totalSales = 0, totalPaid = 0, totalUdhar = 0
      const udharCustomers = new Set()

      filtered.forEach(inv => {
        totalSales += inv.total_amount
        totalPaid += inv.amount_paid
        totalUdhar += inv.balance_due
        if (inv.balance_due > 0) {
          udharCustomers.add(inv.customer_name.toLowerCase())
        }
      })

      document.getElementById('totalSales').innerText = `₹${totalSales.toLocaleString('en-IN')}`
      document.getElementById('totalPaid').innerText = `₹${totalPaid.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`
      document.getElementById('udharCount').innerText = udharCustomers.size

      // Render table
      const list = document.getElementById('invoiceList')
      if (filtered.length === 0) {
        list.innerHTML = '<tr><td colspan="6" class="empty">No invoices found</td></tr>'
        return
      }

      list.innerHTML = filtered.map(inv => {
        const hasDue = inv.balance_due > 0
        const paymentMethod = inv.payment_method || (hasDue ? 'Udhar' : 'Cash')
        const paymentClass = paymentMethod === 'Cash' ? 'badge-cash' : 
                           paymentMethod === 'UPI' ? 'badge-upi' : 'badge-udhar'
        
        return `
          <tr>
            <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
            <td>${inv.customer_name}</td>
            <td class="text-right amount">₹${inv.total_amount.toLocaleString('en-IN')}</td>
            <td class="text-right amount green">₹${inv.amount_paid.toLocaleString('en-IN')}</td>
            <td class="text-right amount ${hasDue? 'red' : ''}">₹${inv.balance_due.toLocaleString('en-IN')}</td>
            <td><span class="badge ${paymentClass}">${paymentMethod}</span></td>
          </tr>
        `
      }).join('')
    }

    initApp()
  </script>
</body>
</html>
