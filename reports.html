<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - HISAB PRO V5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
   .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
   .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
   .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
   .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
   .nav-links::-webkit-scrollbar{display:none}
   .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
   .nav-link:hover{background:#15803d;color:#fff}
   .nav-link.active{background:#15803d;color:#fff}
   .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
   .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
   .menu-toggle{display:none}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .filter-btn{padding:10px 16px;border:2px solid #16a34a;background:#fff;color:#16a34a;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:all.2s}
    .filter-btn.active{background:#16a34a;color:#fff}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
    .stat-label{font-size:14px;color:#666;margin-bottom:8px}
    .stat-value{font-size:28px;font-weight:700;color:#1f2937}
    .stat-value.green{color:#16a34a}
    .stat-value.red{color:#dc2626}
   .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
   .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
   .card h3{font-size:18px;display:flex;align-items:center;gap:8px;margin:0}
   .header-actions{display:flex;gap:8px;flex-wrap:wrap}
   .btn-pdf{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
   .btn-pdf:hover{background:#15803d}
   .btn-pdf-blue{background:#0ea5e9}
   .btn-pdf-blue:hover{background:#0284c7}
   .btn-small{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:#0ea5e9;color:#fff}
   .btn-small:hover{background:#0284c7}
   .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;margin-top:12px;min-width:700px}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:14px}
    th{background:#f9fafb;font-weight:600;position:sticky;top:0}
    .empty-msg{text-align:center;padding:40px;color:#666}
    .badge{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600}
    .badge-paid{background:#dcfce7;color:#16a34a}
    .badge-udhar{background:#fee2e2;color:#dc2626}
   @media (max-width:768px){
     .nav-container{padding:0 8px}
     .nav-brand{font-size:16px;padding:10px 0}
     .nav-links{width:100%;order:3;padding-bottom:4px}
     .nav-link{padding:12px 10px;font-size:13px}
     .btn-logout{padding:6px 10px;font-size:12px}
     .card{padding:16px}
     th,td{padding:10px 6px;font-size:13px}
     .stat-value{font-size:24px}
     .header-actions{width:100%}
     .btn-pdf{flex:1;justify-content:center}
   }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links" id="navLinks">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link active">Reports</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All Time</button>
      <button class="filter-btn" data-filter="month">This Month</button>
      <button class="filter-btn" data-filter="week">This Week</button>
      <button class="filter-btn" data-filter="today">Today</button>
    </div>

    <div class="card">
      <h3 id="reportTitle">All Time Report</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Sale</div>
          <div class="stat-value" id="totalSale">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Collection</div>
          <div class="stat-value green" id="totalCollection">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Udhar</div>
          <div class="stat-value red" id="totalUdhar">₹0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>⚠️ Udhar Bills - Payment Pending</h3>
        <button class="btn-pdf" id="downloadUdharPdfBtn" style="display:none">📄 Download Udhar PDF</button>
      </div>
      <div class="table-wrap" id="udharTable"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>All Invoice Details</h3>
        <div class="header-actions">
          <button class="btn-pdf btn-pdf-blue" id="downloadFullReportBtn">📄 Download Full Report</button>
        </div>
      </div>
      <div class="table-wrap" id="allInvoicesTable"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let currentFilter = 'all'
    let udharBillsData = []
    let allInvoicesData = []
    let reportStats = { sale: 0, collection: 0, udhar: 0 }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadReports()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadReports()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        currentFilter = btn.dataset.filter
        loadReports()
      }
    })

    function getDateRange(filter) {
      const today = new Date()
      let start, end = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59)
      let title = 'All Time Report'

      if (filter === 'today') {
        start = new Date(today.getFullYear(), today.getMonth(), today.getDate())
        title = 'Today\'s Report'
      } else if (filter === 'week') {
        const day = today.getDay()
        start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - day)
        title = 'This Week\'s Report'
      } else if (filter === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1)
        title = 'This Month\'s Report'
      }

      return { start: start?.toISOString(), end: end.toISOString(), title }
    }

    async function loadReports() {
      if (!currentSession) return

      const { start, end, title } = getDateRange(currentFilter)
      document.getElementById('reportTitle').innerText = title

      let query = supabase
       .from('invoices')
       .select('*, customers(name, phone)')
       .eq('user_id', currentSession.user.id)
       .order('date', { ascending: false })

      if (start) {
        query = query.gte('date', start).lte('date', end)
      }

      const { data: invoices, error } = await query

      if (error) {
        console.error('Error:', error)
        return
      }

      allInvoicesData = invoices || []
      const totalSale = allInvoicesData.reduce((sum, inv) => sum + Number(inv.total_amount), 0) || 0
      const totalCollection = allInvoicesData.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0) || 0
      const totalUdhar = allInvoicesData.reduce((sum, inv) => sum + Number(inv.balance_due || 0), 0) || 0

      reportStats = { sale: totalSale, collection: totalCollection, udhar: totalUdhar }

      document.getElementById('totalSale').innerText = `₹${totalSale.toLocaleString('en-IN')}`
      document.getElementById('totalCollection').innerText = `₹${totalCollection.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`

      udharBillsData = allInvoicesData.filter(inv => inv.balance_due > 0)
      renderUdharTable(udharBillsData)
      renderAllInvoicesTable(allInvoicesData)
    }

    function renderUdharTable(invoices) {
      const div = document.getElementById('udharTable')
      const downloadBtn = document.getElementById('downloadUdharPdfBtn')
      
      if (invoices.length === 0) {
        div.innerHTML = '<div class="empty-msg">🎉 Sab clear hai! Koi udhar bacha nahi</div>'
        downloadBtn.style.display = 'none'
        return
      }

      downloadBtn.style.display = 'flex'
      let html = '<table><tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr>'
      invoices.forEach(inv => {
        html += `<tr>
          <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
          <td>${inv.customers?.name || inv.customer_name || 'N/A'}</td>
          <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}</td>
          <td style="color:#dc2626;font-weight:600">₹${Number(inv.balance_due).toLocaleString('en-IN')}</td>
          <td><span class="badge badge-udhar">Udhar</span></td>
        </tr>`
      })
      html += '</table>'
      div.innerHTML = html
    }

    function renderAllInvoicesTable(invoices) {
      const div = document.getElementById('allInvoicesTable')
      if (invoices.length === 0) {
        div.innerHTML = '<div class="empty-msg">No invoices found</div>'
        return
      }

      let html = '<table><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Mode</th><th>Status</th><th>Action</th></tr>'
      invoices.forEach(inv => {
        const status = inv.balance_due > 0 ? '<span class="badge badge-udhar">Udhar</span>' : '<span class="badge badge-paid">Paid</span>'
        html += `<tr>
          <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
          <td>${inv.customers?.name || inv.customer_name || 'N/A'}</td>
          <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.balance_due || 0).toLocaleString('en-IN')}</td>
          <td>${inv.payment_mode || '-'}</td>
          <td>${status}</td>
          <td><button class="btn-small" onclick="downloadInvoicePDF(${inv.id})">📄 PDF</button></td>
        </tr>`
      })
      html += '</table>'
      div.innerHTML = html
    }

    // 1. Udhar Bills PDF
    document.getElementById('downloadUdharPdfBtn').onclick = () => {
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const filterNames = {
        'all': 'All Time',
        'month': 'This Month',
        'week': 'This Week',
        'today': 'Today'
      }

      doc.setFontSize(18)
      doc.setTextColor(22, 163, 74)
      doc.text('HISAB PRO V5 - Udhar Report', 14, 20)

      doc.setFontSize(10)
      doc.setTextColor(100)
      doc.text(`Filter: ${filterNames[currentFilter]}`, 14, 28)
      doc.text(`Generated: ${new Date().toLocaleString('en-GB')}`, 14, 34)
      doc.text(`User: ${currentSession.user.email}`, 14, 40)

      doc.setFontSize(11)
      doc.setTextColor(0)
      doc.text(`Total Sale: ₹${reportStats.sale.toLocaleString('en-IN')}`, 14, 50)
      doc.text(`Total Collection: ₹${reportStats.collection.toLocaleString('en-IN')}`, 80, 50)
      doc.setTextColor(220, 38, 38)
      doc.text(`Total Udhar: ₹${reportStats.udhar.toLocaleString('en-IN')}`, 146, 50)

      const tableData = udharBillsData.map(inv => [
        new Date(inv.date).toLocaleDateString('en-GB'),
        inv.customers?.name || inv.customer_name || 'N/A',
        `₹${Number(inv.total_amount).toLocaleString('en-IN')}`,
        `₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}`,
        `₹${Number(inv.balance_due).toLocaleString('en-IN')}`
      ])

      doc.autoTable({
        startY: 58,
        head: [['Date', 'Customer', 'Total', 'Paid', 'Balance']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [22, 163, 74], fontSize: 10 },
        bodyStyles: { fontSize: 9 },
        columnStyles: { 4: { textColor: [220, 38, 38], fontStyle: 'bold' } }
      })

      const fileName = `Udhar_Report_${filterNames[currentFilter]}_${new Date().toISOString().split('T')[0]}.pdf`
      doc.save(fileName)
    }

    // 2. Full Report PDF - Saare invoices
    document.getElementById('downloadFullReportBtn').onclick = () => {
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const filterNames = {
        'all': 'All Time',
        'month': 'This Month',
        'week': 'This Week',
        'today': 'Today'
      }

      doc.setFontSize(18)
      doc.setTextColor(22, 163, 74)
      doc.text('HISAB PRO V5 - Full Report', 14, 20)

      doc.setFontSize(10)
      doc.setTextColor(100)
      doc.text(`Filter: ${filterNames[currentFilter]}`, 14, 28)
      doc.text(`Generated: ${new Date().toLocaleString('en-GB')}`, 14, 34)
      doc.text(`User: ${currentSession.user.email}`, 14, 40)

      doc.setFontSize(11)
      doc.setTextColor(0)
      doc.text(`Total Sale: ₹${reportStats.sale.toLocaleString('en-IN')}`, 14, 50)
      doc.setTextColor(22, 163, 74)
      doc.text(`Total Collection: ₹${reportStats.collection.toLocaleString('en-IN')}`, 80, 50)
      doc.setTextColor(220, 38, 38)
      doc.text(`Total Udhar: ₹${reportStats.udhar.toLocaleString('en-IN')}`, 146, 50)

      const tableData = allInvoicesData.map(inv => [
        new Date(inv.date).toLocaleDateString('en-GB'),
        inv.customers?.name || inv.customer_name || 'N/A',
        `₹${Number(inv.total_amount).toLocaleString('en-IN')}`,
        `₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}`,
        `₹${Number(inv.balance_due || 0).toLocaleString('en-IN')}`,
        inv.payment_mode || '-',
        inv.balance_due > 0 ? 'Udhar' : 'Paid'
      ])

      doc.autoTable({
        startY: 58,
        head: [['Date', 'Customer', 'Total', 'Paid', 'Balance', 'Mode', 'Status']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [22, 163, 74], fontSize: 9 },
        bodyStyles: { fontSize: 8 },
        columnStyles: {
          4: { textColor: [220, 38, 38], fontStyle: 'bold' },
          6: { fontStyle: 'bold' }
        }
      })

      const fileName = `Full_Report_${filterNames[currentFilter]}_${new Date().toISOString().split('T')[0]}.pdf`
      doc.save(fileName)
    }

    // 3. Single Invoice PDF
    window.downloadInvoicePDF = async (invoiceId) => {
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const { data: invoice, error } = await supabase
        .from('invoices')
        .select('*, customers(name, phone), invoice_items(*)')
        .eq('id', invoiceId)
        .single()

      if (error) {
        alert('Error loading invoice')
        return
      }

      doc.setFontSize(20)
      doc.setTextColor(22, 163, 74)
      doc.text('HISAB PRO V5', 14, 20)
      doc.setFontSize(12)
      doc.setTextColor(100)
      doc.text('Invoice', 14, 28)

      doc.setFontSize(10)
      doc.setTextColor(0)
      doc.text(`Invoice #: ${invoice.id}`, 14, 40)
      doc.text(`Date: ${new Date(invoice.date).toLocaleDateString('en-GB')}`, 14, 46)
      doc.text(`Payment Mode: ${invoice.payment_mode || 'N/A'}`, 14, 52)

      doc.setFontSize(11)
      doc.setFont('helvetica', 'bold')
      doc.text('Bill To:', 14, 62)
      doc.setFont('helvetica', 'normal')
      doc.text(invoice.customers?.name || invoice.customer_name, 14, 68)
      if (invoice.customers?.phone) {
        doc.text(`Phone: ${invoice.customers.phone}`, 14, 74)
      }

      const tableData = invoice.invoice_items.map(item => [
        item.item_name,
        item.quantity,
        `₹${Number(item.price).toLocaleString('en-IN')}`,
        `₹${Number(item.total).toLocaleString('en-IN')}`
      ])

      doc.autoTable({
        startY: 82,
        head: [['Item', 'Qty', 'Price', 'Total']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [22, 163, 74], fontSize: 10 },
        bodyStyles: { fontSize: 9 }
      })

      const finalY = doc.lastAutoTable.finalY + 10

      doc.setFontSize(11)
      doc.text('Subtotal:', 130, finalY)
      doc.text(`₹${Number(invoice.total_amount).toLocaleString('en-IN')}`, 180, finalY, { align: 'right' })

      doc.text('Amount Paid:', 130, finalY + 6)
      doc.text(`₹${Number(invoice.amount_paid || 0).toLocaleString('en-IN')}`, 180, finalY + 6, { align: 'right' })

      doc.setFont('helvetica', 'bold')
      doc.text('Balance Due:', 130, finalY + 14)
      doc.setTextColor(invoice.balance_due > 0 ? 220 : 22, invoice.balance_due > 0 ? 38 : 163, invoice.balance_due > 0 ? 38 : 74)
      doc.text(`₹${Number(invoice.balance_due || 0).toLocaleString('en-IN')}`, 180, finalY + 14, { align: 'right' })

      doc.setFontSize(9)
      doc.setTextColor(150)
      doc.text('Thank you for your business!', 14, finalY + 30)
      doc.text(`Generated by HISAB PRO V5 on ${new Date().toLocaleString('en-GB')}`, 14, finalY + 36)

      const fileName = `Invoice_${invoice.customers?.name || invoice.customer_name}_${invoice.id}.pdf`
      doc.save(fileName)
    }

    initApp()
  </script>
</body>
</html>
