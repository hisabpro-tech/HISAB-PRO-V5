<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.nav-brand{color:#fff;font-size:20px;font-weight:700;padding:16px 0}.nav-links{display:flex;gap:4px}.nav-link{color:#d1fae5;text-decoration:none;padding:18px 16px;display:block;font-weight:500;font-size:15px;transition:all.2s}.nav-link:hover{background:#15803d;color:#fff}.nav-link.active{background:#15803d;color:#fff}.nav-user{display:flex;align-items:center;gap:12px}#userEmail{color:#d1fae5;font-size:14px}.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}.container{max-width:1200px;margin:0 auto;padding:20px 16px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:24px}.stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}.stat-label{font-size:14px;color:#666;margin-bottom:8px}.stat-value{font-size:28px;font-weight:700;color:#1f2937}.stat-value.green{color:#16a34a}.stat-value.red{color:#dc2626}.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}.card h3{margin-bottom:16px;font-size:18px;display:flex;align-items:center;gap:8px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:14px}th{background:#f9fafb;font-weight:600}.empty-msg{text-align:center;padding:40px;color:#666}@media (max-width:768px){.nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#16a34a;flex-direction:column}.nav-links.show{display:flex}.menu-toggle{display:block}#userEmail{display:none}table{font-size:12px}th,td{padding:8px 4px}}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div style="display:flex;align-items:center;gap:16px">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-brand">HISAB PRO V5</div>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link active">Reports</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h3>This Month's Report</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Sale</div>
          <div class="stat-value" id="totalSale">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Collection</div>
          <div class="stat-value green" id="totalCollection">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Udhar</div>
          <div class="stat-value red" id="totalUdhar">₹0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>⚠️ Udhar Bills - Payment Pending</h3>
      <div id="udharTable"></div>
    </div>

    <div class="card">
      <h3>All Invoice Details</h3>
      <div id="allInvoicesTable"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null

    // 1. Auth state change listener - SESSION REFRESH FIX
    supabase.auth.onAuthStateChange((event, session) => {
      console.log('Auth event:', event)

      if (event === 'SIGNED_OUT') {
        window.location.replace('/login.html')
        return
      }

      if (event === 'TOKEN_REFRESHED') {
        console.log('Token refresh ho gaya')
        currentSession = session
      }

      if (event === 'SIGNED_IN' && session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadReports()
      }
    })

    // 2. Page load pe session check
    async function initApp() {
      const { data: { session }, error } = await supabase.auth.getSession()

      if (error ||!session) {
        console.log('Session nahi mila, login pe bhej raha')
        window.location.replace('/login.html')
        return
      }

      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadReports()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('menuToggle').onclick = () => {
      document.getElementById('navLinks').classList.toggle('show')
    }

    async function loadReports() {
      if (!currentSession) return

      const today = new Date()
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0]
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0] + 'T23:59:59'

      // Month ke invoices
      const { data: monthInvoices, error } = await supabase
       .from('invoices')
       .select('*, customers(name)')
       .eq('user_id', currentSession.user.id)
       .gte('date', firstDay)
       .lte('date', lastDay)
       .order('date', { ascending: false })

      if (error) {
        console.error('Error loading reports:', error)
        return
      }

      // Stats calculate
      const totalSale = monthInvoices?.reduce((sum, inv) => sum + Number(inv.total_amount), 0) || 0
      const totalCollection = monthInvoices?.reduce((sum, inv) => sum + Number(inv.amount_paid || 0), 0) || 0
      const totalUdhar = monthInvoices?.reduce((sum, inv) => sum + Number(inv.balance_due || 0), 0) || 0

      document.getElementById('totalSale').innerText = `₹${totalSale.toLocaleString('en-IN')}`
      document.getElementById('totalCollection').innerText = `₹${totalCollection.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`

      // Udhar bills
      const udharBills = monthInvoices?.filter(inv => inv.balance_due > 0) || []
      renderUdharTable(udharBills)

      // All invoices
      renderAllInvoices(monthInvoices || [])
    }

    function renderUdharTable(invoices) {
      const div = document.getElementById('udharTable')
      if (invoices.length === 0) {
        div.innerHTML = '<div class="empty-msg">🎉 Sab clear hai! Koi udhar bacha nahi</div>'
        return
      }

      let html = '<table><tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance Due</th></tr>'
      invoices.forEach(inv => {
        html += `<tr>
          <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
          <td>${inv.customers?.name || 'N/A'}</td>
          <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}</td>
          <td style="color:#dc2626;font-weight:600">₹${Number(inv.balance_due).toLocaleString('en-IN')}</td>
        </tr>`
      })
      html += '</table>'
      div.innerHTML = html
    }

    function renderAllInvoices(invoices) {
      const div = document.getElementById('allInvoicesTable')
      if (invoices.length === 0) {
        div.innerHTML = '<div class="empty-msg">No invoices found</div>'
        return
      }

      let html = '<table><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Mode</th></tr>'
      invoices.forEach(inv => {
        html += `<tr>
          <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
          <td>${inv.customers?.name || 'N/A'}</td>
          <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.amount_paid || 0).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.balance_due || 0).toLocaleString('en-IN')}</td>
          <td>${inv.payment_mode || '-'}</td>
        </tr>`
      })
      html += '</table>'
      div.innerHTML = html
    }

    initApp()
  </script>
</body>
</html>
