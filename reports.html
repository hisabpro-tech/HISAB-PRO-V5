<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.nav-brand{color:#fff;font-size:20px;font-weight:700;padding:16px 0}.nav-links{display:flex;gap:4px}.nav-link{color:#d1fae5;text-decoration:none;padding:18px 16px;display:block;font-weight:500;font-size:15px;transition:all.2s}.nav-link:hover{background:#15803d;color:#fff}.nav-link.active{background:#15803d;color:#fff}.nav-user{display:flex;align-items:center;gap:12px}#userEmail{color:#d1fae5;font-size:14px}.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}.container{max-width:1100px;margin:0 auto;padding:20px 16px}.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}.card h3{margin-bottom:16px;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat-box{background:#f8fafc;padding:20px;border-radius:8px;text-align:center}.stat-label{font-size:13px;color:#64748b;margin-bottom:8px}.stat-value{font-size:24px;font-weight:700}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;padding:12px;background:#f9fafb;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}.table td{padding:12px;border-bottom:1px solid #f3f4f6}.badge{padding:3px 8px;border-radius:10px;font-size:12px;font-weight:600;display:inline-block}.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}.badge-blue{background:#dbeafe;color:#1e40af}.alert{background:#fef3c7;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;color:#92400e}@media (max-width:768px){.nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#16a34a;flex-direction:column}.nav-links.show{display:flex}.menu-toggle{display:block}#userEmail{display:none}.stats{grid-template-columns:1fr}.table{font-size:12px}}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div style="display:flex;align-items:center;gap:16px">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="nav-brand">HISAB PRO V5</div>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link active">Reports</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h3>This Month's Report</h3>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Total Sale</div>
          <div class="stat-value" id="totalSale">₹0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Collection</div>
          <div class="stat-value" id="totalCollection">₹0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Udhar</div>
          <div class="stat-value" style="color:#dc2626" id="totalUdhar">₹0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>⚠️ Udhar Bills - Payment Pending</h3>
      <table class="table">
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance Due</th></tr>
        </thead>
        <tbody id="udharTable">
          <tr><td colspan="5" style="text-align:center;color:#999">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>All Invoice Details</h3>
      <table class="table">
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Mode</th></tr>
        </thead>
        <tbody id="allInvoicesTable">
          <tr><td colspan="6" style="text-align:center;color:#999">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    const supabase = createClient(import.meta.env.VITE_SUPABASE_URL, import.meta.env.VITE_SUPABASE_ANON_KEY)
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) window.location.replace('/login.html')
    if (session?.user?.email) document.getElementById('userEmail').innerText = session.user.email
    document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); window.location.replace('/login.html') }
    document.getElementById('menuToggle').onclick = () => { document.getElementById('navLinks').classList.toggle('show') }

    async function loadReports() {
      const now = new Date()
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0]
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0]

      const { data: monthInvoices } = await supabase
     .from('invoices')
     .select('*, customers(name)')
     .eq('user_id', session.user.id)
     .gte('date', firstDay)
     .lte('date', lastDay)
     .order('date', { ascending: false })

      // ✅ FIXED LOGIC: Accounting formula use kiya
      const totalSale = monthInvoices.reduce((sum, inv) => sum + Number(inv.total_amount), 0)
      const totalUdhar = monthInvoices.reduce((sum, inv) => sum + Number(inv.balance_due), 0)
      const totalCollection = totalSale - totalUdhar // Kabhi mismatch nahi hoga

      document.getElementById('totalSale').innerText = `₹${totalSale.toLocaleString('en-IN')}`
      document.getElementById('totalCollection').innerText = `₹${totalCollection.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`

      // Udhar bills table
      const udharBills = monthInvoices.filter(inv => inv.status === 'unpaid' && Number(inv.balance_due) > 0)
      const udharTbody = document.getElementById('udharTable')
      if (udharBills.length === 0) {
        udharTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999">🎉 Sab clear hai! Koi udhar bacha nahi</td></tr>'
      } else {
        udharTbody.innerHTML = udharBills.map(inv => `
          <tr>
            <td>${new Date(inv.date).toLocaleDateString('en-GB')}</td>
            <td>${inv.customers?.name || '-'}</td>
            <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
            <td>₹${Number(inv.amount_paid).toLocaleString('en-IN')}</td>
            <td><span class="badge badge-red">₹${Number(inv.balance_due).toLocaleString('en-IN')}</span></td>
          </tr>
        `).join('')
      }

      // All invoices table
      const allTbody = document.getElementById('allInvoicesTable')
      allTbody.innerHTML = monthInvoices.length? monthInvoices.map(inv => `
        <tr>
          <td>${new Date(inv.date).toLocaleDateString('en-GB')}</td>
          <td>${inv.customers?.name || '-'}</td>
          <td>₹${Number(inv.total_amount).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.amount_paid).toLocaleString('en-IN')}</td>
          <td>₹${Number(inv.balance_due).toLocaleString('en-IN')}</td>
          <td><span class="badge ${inv.payment_type === 'cash'? 'badge-green' : 'badge-blue'}">${inv.payment_type}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="6" style="text-align:center;color:#999">No invoices found</td></tr>'
    }

    loadReports()
  </script>
</body>
</html>
