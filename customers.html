<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
   .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
   .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
   .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
   .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
   .nav-links::-webkit-scrollbar{display:none}
   .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
   .nav-link:hover{background:#15803d;color:#fff}
   .nav-link.active{background:#15803d;color:#fff}
   .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
   .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
   .menu-toggle{display:none}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .search-box{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px;margin-bottom:20px}
    .search-box:focus{outline:none;border-color:#16a34a}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
    .stat-label{font-size:14px;color:#666;margin-bottom:8px}
    .stat-value{font-size:28px;font-weight:700;color:#1f2937}
    .stat-value.blue{color:#0ea5e9}
    .stat-value.red{color:#dc2626}
    .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
    .card h3{font-size:18px;margin-bottom:16px}
    .customer-list{display:flex;flex-direction:column;gap:12px}
    .customer-item{background:#f9fafb;padding:16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;transition:all.2s}
    .customer-item:hover{background:#f3f4f6}
    .customer-info{flex:1}
    .customer-name{font-weight:600;font-size:16px;margin-bottom:4px}
    .customer-phone{font-size:14px;color:#666}
    .customer-stats{display:flex;gap:16px;text-align:right}
    .customer-stat{display:flex;flex-direction:column}
    .customer-stat-label{font-size:12px;color:#666}
    .customer-stat-value{font-weight:700;font-size:15px}
    .empty-msg{text-align:center;padding:40px;color:#666}
    .badge{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600}
    .badge-udhar{background:#fee2e2;color:#dc2626}
    .badge-clear{background:#dcfce7;color:#16a34a}
   @media (max-width:768px){
     .nav-container{padding:0 8px}
     .nav-brand{font-size:16px;padding:10px 0}
     .nav-links{width:100%;order:3;padding-bottom:4px}
     .nav-link{padding:12px 10px;font-size:13px}
     .btn-logout{padding:6px 10px;font-size:12px}
     .card{padding:16px}
     .customer-item{flex-direction:column;align-items:flex-start;gap:12px}
     .customer-stats{width:100%;justify-content:space-between}
   }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link active">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search customers by name or phone...">
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Customers</div>
        <div class="stat-value blue" id="totalCustomers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Customers with Udhar</div>
        <div class="stat-value red" id="customersWithUdhar">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Udhar</div>
        <div class="stat-value red" id="totalUdhar">₹0</div>
      </div>
    </div>

    <div class="card">
      <h3>All Customers</h3>
      <div class="customer-list" id="customerList"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let allCustomers = []
    let customerStats = {}

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadCustomers()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadCustomers()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('searchBox').oninput = (e) => {
      renderCustomers(e.target.value.toLowerCase())
    }

    async function loadCustomers() {
      if (!currentSession) return

      // Load customers
      const { data: customers, error } = await supabase
        .from('customers')
        .select('*')
        .eq('user_id', currentSession.user.id)
        .order('created_at', { ascending: false })

      if (error) {
        console.error('Error:', error)
        return
      }

      allCustomers = customers || []

      // Load invoices to calculate stats
      const { data: invoices } = await supabase
        .from('invoices')
        .select('customer_id, total_amount, amount_paid, balance_due')
        .eq('user_id', currentSession.user.id)

      // Calculate stats per customer
      customerStats = {}
      invoices?.forEach(inv => {
        if (!customerStats[inv.customer_id]) {
          customerStats[inv.customer_id] = { total: 0, paid: 0, udhar: 0, count: 0 }
        }
        customerStats[inv.customer_id].total += Number(inv.total_amount)
        customerStats[inv.customer_id].paid += Number(inv.amount_paid || 0)
        customerStats[inv.customer_id].udhar += Number(inv.balance_due || 0)
        customerStats[inv.customer_id].count += 1
      })

      updateStats()
      renderCustomers()
    }

    function updateStats() {
      const totalCustomers = allCustomers.length
      const customersWithUdhar = Object.values(customerStats).filter(s => s.udhar > 0).length
      const totalUdhar = Object.values(customerStats).reduce((sum, s) => sum + s.udhar, 0)

      document.getElementById('totalCustomers').innerText = totalCustomers
      document.getElementById('customersWithUdhar').innerText = customersWithUdhar
      document.getElementById('totalUdhar').innerText = `₹${totalUdhar.toLocaleString('en-IN')}`
    }

    function renderCustomers(searchTerm = '') {
      const div = document.getElementById('customerList')
      const filtered = allCustomers.filter(c => 
        c.name.toLowerCase().includes(searchTerm) || 
        (c.phone && c.phone.includes(searchTerm))
      )

      if (filtered.length === 0) {
        div.innerHTML = '<div class="empty-msg">No customers found</div>'
        return
      }

      div.innerHTML = filtered.map(customer => {
        const stats = customerStats[customer.id] || { total: 0, udhar: 0, count: 0 }
        const badge = stats.udhar > 0 
          ? `<span class="badge badge-udhar">₹${stats.udhar.toLocaleString('en-IN')} Udhar</span>`
          : `<span class="badge badge-clear">Clear</span>`

        return `
          <div class="customer-item">
            <div class="customer-info">
              <div class="customer-name">${customer.name}</div>
              <div class="customer-phone">${customer.phone || 'No phone'}</div>
            </div>
            <div class="customer-stats">
              <div class="customer-stat">
                <div class="customer-stat-label">Invoices</div>
                <div class="customer-stat-value">${stats.count}</div>
              </div>
              <div class="customer-stat">
                <div class="customer-stat-label">Total Business</div>
                <div class="customer-stat-value">₹${stats.total.toLocaleString('en-IN')}</div>
              </div>
              <div class="customer-stat">
                <div class="customer-stat-label">Status</div>
                <div class="customer-stat-value">${badge}</div>
              </div>
            </div>
          </div>
        `
      }).join('')
    }

    initApp()
  </script>
</body>
</html>
