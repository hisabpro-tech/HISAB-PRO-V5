<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
.nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
.nav-link:hover{background:#15803d;color:#fff}
.nav-link.active{background:#15803d;color:#fff}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700}
.search-box{padding:10px 14px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;width:250px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat-mini{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.stat-mini-label{font-size:12px;color:#6b7280;margin-bottom:4px}
.stat-mini-value{font-size:20px;font-weight:700}
.table-wrapper{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#f9fafb;padding:14px 12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:2px solid #e5e7eb;white-space:nowrap}
  td{padding:16px 12px;border-bottom:1px solid #f3f4f6;font-size:14px}
  tr:last-child td{border-bottom:none}
  tr:hover{background:#f9fafb}
  tr.udhar-row{background:#fef2f2}
  tr.udhar-row:hover{background:#fee2e2}
.customer-name{font-weight:600;color:#111827}
.customer-phone{font-size:12px;color:#6b7280;margin-top:2px}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.badge-udhar{background:#fee2e2;color:#dc2626}
.badge-clear{background:#dcfce7;color:#16a34a}
.text-right{text-align:right}
.text-center{text-align:center}
.amount{font-weight:600}
.amount.red{color:#dc2626}
.amount.green{color:#16a34a}
.btn-group{display:flex;gap:6px;justify-content:flex-end}
.btn{padding:6px 12px;border:none;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer}
.btn-collect{background:#16a34a;color:#fff}
.btn-delete{background:#dc2626;color:#fff}
.empty{padding:40px;text-align:center;color:#6b7280}
    @media (max-width:768px){
  .nav-container{padding:0 8px}
  .nav-brand{font-size:16px;padding:10px 0}
  .nav-links{width:100%;order:3;padding-bottom:4px}
  .nav-link{padding:12px 10px;font-size:13px}
  .btn-logout{padding:6px 10px;font-size:12px}
  .search-box{width:100%}
    th,td{padding:10px 8px;font-size:13px}
  .btn{padding:5px 10px;font-size:11px}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/customers.html" class="nav-link active">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Customers</h1>
      <input type="text" class="search-box" id="searchInput" placeholder="Search customer...">
    </div>

    <div class="stats-row">
      <div class="stat-mini">
        <div class="stat-mini-label">Today's Sale</div>
        <div class="stat-mini-value" id="todaySale">₹0</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-label">Today's Collection</div>
        <div class="stat-mini-value" id="todayCollection" style="color:#16a34a">₹0</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-label">Total Udhar</div>
        <div class="stat-mini-value" id="totalUdhar" style="color:#dc2626">₹0</div>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th class="text-center">Invoices</th>
            <th class="text-right">Total Business</th>
            <th class="text-right">Paid</th>
            <th class="text-right">Balance</th>
            <th>Last Invoice</th>
            <th class="text-center">Status</th>
            <th class="text-right">Action</th>
          </tr>
        </thead>
        <tbody id="customersList"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let allCustomers = []

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadCustomers()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadCustomers()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase()
      const filtered = allCustomers.filter(c => c.name.toLowerCase().includes(query))
      renderCustomers(filtered)
    })

    async function loadCustomers() {
      const today = new Date().toISOString().split('T')[0]

      // 1. Today's stats
      const { data: todayInvoices } = await supabase
    .from('invoices')
    .select('total_amount,amount_paid,balance_due')
    .eq('user_id', currentSession.user.id)
    .eq('date', today)

      let todaySale = 0, todayCollection = 0, totalUdharAll = 0
      if (todayInvoices) {
        todayInvoices.forEach(inv => {
          todaySale += inv.total_amount
          todayCollection += inv.amount_paid
        })
      }

      // 2. All invoices grouped by customer
      const { data: allInvoices } = await supabase
    .from('invoices')
    .select('*')
    .eq('user_id', currentSession.user.id)
    .order('date', { ascending: false })

      const customerMap = {}
      if (allInvoices) {
        allInvoices.forEach(inv => {
          const key = inv.customer_name.toLowerCase()
          if (!customerMap[key]) {
            customerMap[key] = {
              name: inv.customer_name,
              phone: inv.customer_phone || 'No phone',
              totalBusiness: 0,
              totalPaid: 0,
              totalUdhar: 0,
              invoiceCount: 0,
              lastDate: inv.date,
              invoiceIds: []
            }
          }
          customerMap[key].totalBusiness += inv.total_amount
          customerMap[key].totalPaid += inv.amount_paid
          customerMap[key].totalUdhar += inv.balance_due
          customerMap[key].invoiceCount += 1
          customerMap[key].invoiceIds.push(inv.id)
          if (inv.date > customerMap[key].lastDate) customerMap[key].lastDate = inv.date
        })
      }

      // 3. Convert to array + Sort: Udhar wale top pe
      allCustomers = Object.values(customerMap).sort((a, b) => {
        if (b.totalUdhar!== a.totalUdhar) return b.totalUdhar - a.totalUdhar
        return b.totalBusiness - a.totalBusiness
      })

      totalUdharAll = allCustomers.reduce((sum, c) => sum + c.totalUdhar, 0)

      document.getElementById('todaySale').innerText = `₹${todaySale.toLocaleString('en-IN')}`
      document.getElementById('todayCollection').innerText = `₹${todayCollection.toLocaleString('en-IN')}`
      document.getElementById('totalUdhar').innerText = `₹${totalUdharAll.toLocaleString('en-IN')}`

      renderCustomers(allCustomers)
    }

    function renderCustomers(customers) {
      const list = document.getElementById('customersList')
      if (customers.length === 0) {
        list.innerHTML = '<tr><td colspan="8" class="empty">No customers found</td></tr>'
        return
      }

      list.innerHTML = customers.map((c, idx) => {
        const hasUdhar = c.totalUdhar > 0
        const rowClass = hasUdhar? 'udhar-row' : ''
        const badge = hasUdhar
       ? `<span class="badge badge-udhar">₹${c.totalUdhar.toLocaleString('en-IN')} Udhar</span>`
          : `<span class="badge badge-clear">Clear</span>`

        return `
          <tr class="${rowClass}">
            <td>
              <div class="customer-name">${c.name}</div>
              <div class="customer-phone">${c.phone}</div>
            </td>
            <td class="text-center">${c.invoiceCount}</td>
            <td class="text-right amount">₹${c.totalBusiness.toLocaleString('en-IN')}</td>
            <td class="text-right amount green">₹${c.totalPaid.toLocaleString('en-IN')}</td>
            <td class="text-right amount ${hasUdhar? 'red' : ''}">₹${c.totalUdhar.toLocaleString('en-IN')}</td>
            <td>${new Date(c.lastDate).toLocaleDateString('en-IN')}</td>
            <td class="text-center">${badge}</td>
            <td>
              <div class="btn-group">
                ${hasUdhar? `<button class="btn btn-collect" onclick="collectPayment('${c.name}', ${c.totalUdhar})">Collect</button>` : ''}
                <button class="btn btn-delete" onclick="deleteCustomer('${c.name}')">Delete</button>
              </div>
            </td>
          </tr>
        `
      }).join('')
    }

    // Global functions for buttons
    window.collectPayment = async (customerName, amount) => {
      const paid = prompt(`Collect payment from ${customerName}\nPending: ₹${amount.toLocaleString('en-IN')}\n\nEnter amount:`, amount)
      if (!paid || isNaN(paid) || paid <= 0) return

      const collectAmount = parseFloat(paid)
      if (collectAmount > amount) {
        alert('Amount cannot be more than pending balance')
        return
      }

      // Get all pending invoices for this customer
      const { data: invoices } = await supabase
      .from('invoices')
      .select('*')
      .eq('user_id', currentSession.user.id)
      .eq('customer_name', customerName)
      .gt('balance_due', 0)
      .order('date', { ascending: true })

      let remaining = collectAmount
      for (const inv of invoices) {
        if (remaining <= 0) break
        const payThis = Math.min(remaining, inv.balance_due)
        const newPaid = inv.amount_paid + payThis
        const newBalance = inv.total_amount - newPaid

        await supabase
        .from('invoices')
        .update({ amount_paid: newPaid, balance_due: newBalance })
        .eq('id', inv.id)

        remaining -= payThis
      }

      alert(`₹${collectAmount.toLocaleString('en-IN')} collected from ${customerName}`)
      loadCustomers()
    }

    window.deleteCustomer = async (customerName) => {
      if (!confirm(`Delete all invoices for ${customerName}?\nThis cannot be undone!`)) return

      const { error } = await supabase
      .from('invoices')
      .delete()
      .eq('user_id', currentSession.user.id)
      .eq('customer_name', customerName)

      if (error) {
        alert('Error deleting: ' + error.message)
      } else {
        alert(`${customerName} deleted successfully`)
        loadCustomers()
      }
    }

    initApp()
  </script>
</body>
</html>
