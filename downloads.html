<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
.nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
.nav-link:hover{background:#15803d;color:#fff}
.nav-link.active{background:#15803d;color:#fff}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.download-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:24px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.card-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;gap:8px}
.btn-report{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.btn-report.blue{background:#2563eb}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border:2px solid #e5e7eb;background:#fff;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:#6b7280;transition:all.2s}
.filter-btn.active{background:#16a34a;color:#fff;border-color:#16a34a}
.search-box{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:16px}
.search-box:focus{outline:none;border-color:#16a34a}
.table-wrapper{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#f9fafb;padding:12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:2px solid #e5e7eb;white-space:nowrap}
  td{padding:12px;border-bottom:1px solid #f3f4f6;font-size:14px}
  tr:last-child td{border-bottom:none}
  tr:hover{background:#f9fafb}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.badge-udhar{background:#fee2e2;color:#dc2626}
.badge-paid{background:#dcfce7;color:#16a34a}
.text-right{text-align:right}
.amount{font-weight:600}
.amount.red{color:#dc2626}
.empty{padding:40px;text-align:center;color:#6b7280}
    @media (max-width:768px){
  .nav-container{padding:0 8px}
  .nav-brand{font-size:16px;padding:10px 0}
  .nav-links{width:100%;order:3;padding-bottom:4px}
  .nav-link{padding:12px 10px;font-size:13px}
  .btn-logout{padding:6px 10px;font-size:12px}
  .card-header{flex-direction:column;align-items:flex-start}
  .header-actions{width:100%}
  .btn-report{flex:1;justify-content:center;padding:8px 12px;font-size:13px}
  th,td{padding:10px 8px;font-size:13px}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/stock.html" class="nav-link">Stock</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link active">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="download-card">
      <div class="card-header">
        <h2 class="card-title">📁 Download Center</h2>
        <div class="header-actions">
          <button class="btn-report" id="udharReportBtn">📄 Udhar Report</button>
          <button class="btn-report blue" id="fullReportBtn">📄 Full Report</button>
        </div>
      </div>

      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All Invoices</button>
        <button class="filter-btn" data-filter="paid">Paid Only</button>
        <button class="filter-btn" data-filter="udhar">Udhar Only</button>
      </div>

      <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by customer name...">

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th class="text-right">Total</th>
              <th class="text-right">Paid</th>
              <th class="text-right">Balance</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="invoiceList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let allInvoices = []
    let currentFilter = 'all'

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadDownloads()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadDownloads()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        currentFilter = btn.dataset.filter
        renderInvoices()
      }
    })

    document.getElementById('searchBox').oninput = (e) => {
      renderInvoices(e.target.value.toLowerCase())
    }

    document.getElementById('udharReportBtn').onclick = () => exportReport('udhar')
    document.getElementById('fullReportBtn').onclick = () => exportReport('full')

    function exportReport(type) {
      const filtered = type === 'udhar' 
        ? allInvoices.filter(inv => inv.balance_due > 0)
        : allInvoices

      if (filtered.length === 0) return alert('No data to export')

      const csv = [
        ['Date','Customer','Total','Paid','Balance','Status'].join(','),
        ...filtered.map(inv => [
          inv.date,
          `"${inv.customer_name}"`,
          inv.total_amount,
          inv.amount_paid,
          inv.balance_due,
          inv.balance_due > 0 ? 'Udhar' : 'Paid'
        ].join(','))
      ].join('\n')

      const blob = new Blob([csv], { type: 'text/csv' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `${type}_report_${new Date().toISOString().split('T')[0]}.csv`
      a.click()
      URL.revokeObjectURL(url)
    }

    async function loadDownloads() {
      const { data: invoices, error } = await supabase
  .from('invoices')
  .select('*')
  .eq('user_id', currentSession.user.id)
  .order('date', { ascending: false })

      if (error) return console.error(error)

      allInvoices = invoices || []
      renderInvoices()
    }

    function renderInvoices(searchTerm = '') {
      let filtered = allInvoices

      if (currentFilter === 'paid') {
        filtered = filtered.filter(inv => inv.balance_due === 0)
      } else if (currentFilter === 'udhar') {
        filtered = filtered.filter(inv => inv.balance_due > 0)
      }

      if (searchTerm) {
        filtered = filtered.filter(inv => 
          inv.customer_name.toLowerCase().includes(searchTerm)
        )
      }

      const list = document.getElementById('invoiceList')
      if (filtered.length === 0) {
        list.innerHTML = '<tr><td colspan="6" class="empty">No invoices found</td></tr>'
        return
      }

      list.innerHTML = filtered.map(inv => {
        const isUdhar = inv.balance_due > 0
        return `
          <tr>
            <td>${new Date(inv.date).toLocaleDateString('en-IN')}</td>
            <td>${inv.customer_name}</td>
            <td class="text-right amount">₹${inv.total_amount.toLocaleString('en-IN')}</td>
            <td class="text-right amount">₹${inv.amount_paid.toLocaleString('en-IN')}</td>
            <td class="text-right amount ${isUdhar? 'red' : ''}">₹${inv.balance_due.toLocaleString('en-IN')}</td>
            <td><span class="badge ${isUdhar ? 'badge-udhar' : 'badge-paid'}">${isUdhar ? 'Udhar' : 'Paid'}</span></td>
          </tr>
        `
      }).join('')
    }

    initApp()
  </script>
</body>
</html>
