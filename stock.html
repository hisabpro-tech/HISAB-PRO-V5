<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
.nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
.nav-link:hover{background:#15803d;color:#fff}
.nav-link.active{background:#15803d;color:#fff}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
#userEmail{color:#d1fae5;font-size:12px;display:none}
.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.page-title{font-size:24px;font-weight:700;margin-bottom:20px}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
.card h3{font-size:18px;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#374151}
.form-group input{width:100%;padding:10px 12px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px}
.form-group input:focus{outline:none;border-color:#16a34a}
.btn-save{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:12px 24px;cursor:pointer;font-weight:600;font-size:15px}
.btn-save:hover{background:#15803d}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;padding:14px 12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;border-bottom:2px solid #e5e7eb}
td{padding:14px 12px;border-bottom:1px solid #f3f4f6;font-size:14px}
tr:last-child td{border-bottom:none}
tr:hover{background:#f9fafb}
.text-right{text-align:right}
.amount{font-weight:600}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.badge.low{background:#fee2e2;color:#dc2626}
.badge.ok{background:#dcfce7;color:#16a34a}
.btn-delete{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600}
.empty{padding:40px;text-align:center;color:#6b7280}
@media (max-width:768px){
.nav-container{padding:0 8px}
.nav-brand{font-size:16px;padding:10px 0}
.nav-links{width:100%;order:3;padding-bottom:4px}
.nav-link{padding:12px 10px;font-size:13px}
.btn-logout{padding:6px 10px;font-size:12px}
.form-row{grid-template-columns:1fr}
th,td{padding:10px 8px;font-size:13px}
}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link">New Invoice</a>
        <a href="/stock.html" class="nav-link active">Stock</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">Stock Management</h1>

    <div class="card">
      <h3>Add / Update Stock</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Item Name *</label>
          <input type="text" id="itemName" placeholder="Enter item name" required>
        </div>
        <div class="form-group">
          <label>Add Quantity *</label>
          <input type="number" id="itemQty" placeholder="0" min="0" required>
        </div>
        <div class="form-group">
          <label>Purchase Price ₹</label>
          <input type="number" id="purchasePrice" placeholder="0" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Selling Price ₹ *</label>
          <input type="number" id="sellingPrice" placeholder="0" min="0" step="0.01" required>
        </div>
      </div>
      <button class="btn-save" id="saveBtn">Save Stock</button>
    </div>

    <div class="card">
      <h3>Current Stock</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Item Name</th>
              <th class="text-right">Quantity</th>
              <th class="text-right">Purchase Price</th>
              <th class="text-right">Selling Price</th>
              <th class="text-right">Value</th>
              <th>Status</th>
              <th class="text-right">Action</th>
            </tr>
          </thead>
          <tbody id="stockList">
            <tr><td colspan="7" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
        loadStock()
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadStock()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('saveBtn').onclick = async () => {
      const itemName = document.getElementById('itemName').value.trim()
      const itemQty = Number(document.getElementById('itemQty').value) || 0
      const purchasePrice = Number(document.getElementById('purchasePrice').value) || 0
      const sellingPrice = Number(document.getElementById('sellingPrice').value) || 0

      if (!itemName || itemQty <= 0 || sellingPrice <= 0) {
        alert('Please fill Item Name, Quantity and Selling Price')
        return
      }

      const { data: existing } = await supabase
       .from('stock')
       .select('*')
       .eq('user_id', currentSession.user.id)
       .eq('item_name', itemName)
       .single()

      if (existing) {
        await supabase
         .from('stock')
         .update({
            quantity: existing.quantity + itemQty,
            purchase_price: purchasePrice || existing.purchase_price,
            selling_price: sellingPrice
          })
         .eq('id', existing.id)
        alert(`${itemName} updated! New stock: ${existing.quantity + itemQty}`)
      } else {
        await supabase
         .from('stock')
         .insert({
            user_id: currentSession.user.id,
            item_name: itemName,
            quantity: itemQty,
            purchase_price: purchasePrice,
            selling_price: sellingPrice
          })
        alert(`${itemName} added to stock!`)
      }

      document.getElementById('itemName').value = ''
      document.getElementById('itemQty').value = ''
      document.getElementById('purchasePrice').value = ''
      document.getElementById('sellingPrice').value = ''
      loadStock()
    }

    async function loadStock() {
      const { data: stock } = await supabase
       .from('stock')
       .select('*')
       .eq('user_id', currentSession.user.id)
       .order('item_name')

      const list = document.getElementById('stockList')
      if (!stock || stock.length === 0) {
        list.innerHTML = '<tr><td colspan="7" class="empty">No stock items found</td></tr>'
        return
      }

      list.innerHTML = stock.map(item => {
        const value = item.quantity * item.purchase_price
        const badge = item.quantity < 5 ? 'low' : 'ok'
        const status = item.quantity < 5 ? 'Low Stock' : 'In Stock'
        return `
          <tr>
            <td>${item.item_name}</td>
            <td class="text-right amount">${item.quantity}</td>
            <td class="text-right">₹${item.purchase_price.toLocaleString('en-IN')}</td>
            <td class="text-right">₹${item.selling_price.toLocaleString('en-IN')}</td>
            <td class="text-right amount">₹${value.toLocaleString('en-IN')}</td>
            <td><span class="badge ${badge}">${status}</span></td>
            <td class="text-right">
              <button class="btn-delete" onclick="deleteStock('${item.id}')">Delete</button>
            </td>
          </tr>
        `
      }).join('')
    }

    window.deleteStock = async (id) => {
      if (!confirm('Delete this stock item?')) return
      await supabase.from('stock').delete().eq('id', id)
      loadStock()
    }

    initApp()
  </script>
</body>
</html>
