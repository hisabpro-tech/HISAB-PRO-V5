<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Invoice - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}
  .navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
  .nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
  .nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
  .nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
  .nav-link:hover{background:#15803d;color:#fff}
  .nav-link.active{background:#15803d;color:#fff}
  .nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
  .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
  .container{max-width:900px;margin:0 auto;padding:20px 16px}
  .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .card h3{font-size:18px;margin-bottom:20px}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
  .form-group{margin-bottom:0}
  .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
  .form-group input,.form-group select{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:#16a34a}
  .form-group input[readonly]{background:#f9fafb;color:#666;cursor:not-allowed}
  .section-label{font-weight:600;font-size:14px;margin:24px 0 12px 0;display:block}
  .items-header{display:grid;grid-template-columns:2fr 80px 100px 100px 40px;gap:10px;margin-bottom:10px;font-weight:600;font-size:14px}
  .item-row{display:grid;grid-template-columns:2fr 80px 100px 100px 40px;gap:10px;margin-bottom:10px;align-items:center}
  .item-row input{padding:10px;border:2px solid #e5e7eb;border-radius:6px;font-size:14px}
  .btn-remove{background:#dc2626;color:#fff;border:none;border-radius:6px;width:36px;height:36px;cursor:pointer;font-size:18px}
  .btn-add{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14px;margin-top:10px}
  .totals{margin-top:24px;padding-top:20px;border-top:2px solid #e5e7eb}
  .total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
  .total-row.final{font-size:20px;font-weight:700;color:#16a34a;padding-top:12px;border-top:2px solid #e5e7eb}
  .payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
  .btn-save{width:100%;background:#16a34a;color:#fff;border:none;border-radius:8px;padding:16px;cursor:pointer;font-weight:700;font-size:16px;margin-top:20px}
  .btn-save:hover{background:#15803d}
  .btn-save:disabled{background:#9ca3af;cursor:not-allowed}
    @media (max-width:768px){
    .nav-container{padding:0 8px}
    .nav-brand{font-size:16px;padding:10px 0}
    .nav-links{width:100%;order:3;padding-bottom:4px}
    .nav-link{padding:12px 10px;font-size:13px}
    .btn-logout{padding:6px 10px;font-size:12px}
    .card{padding:16px}
    .form-grid{grid-template-columns:1fr;gap:0}
    .form-group{margin-bottom:16px}
    .payment-grid{grid-template-columns:1fr}
    .items-header{display:none}
    .item-row{grid-template-columns:1fr;gap:8px;padding:12px;background:#f9fafb;border-radius:8px;margin-bottom:12px}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link active">New Invoice</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h3>Create New Invoice</h3>

      <div class="form-grid">
        <div class="form-group">
          <label>Customer Name *</label>
          <input type="text" id="customerName" placeholder="Enter customer name" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="customerPhone" placeholder="Enter phone number">
        </div>
        <div class="form-group">
          <label>Invoice Date *</label>
          <input type="text" id="invoiceDate" readonly>
        </div>
        <div class="form-group">
          <label>Payment Mode</label>
          <select id="paymentMode">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Udhar">Udhar</option>
          </select>
        </div>
      </div>

      <label class="section-label">Items</label>
      <div class="items-header">
        <div>Item Name</div>
        <div>Qty</div>
        <div>Price</div>
        <div>Total</div>
        <div></div>
      </div>
      <div id="itemsContainer"></div>
      <button class="btn-add" id="addItemBtn">+ Add Item</button>

      <div class="totals">
        <div class="total-row">
          <span>Subtotal:</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="total-row">
          <span>Amount Paid:</span>
          <input type="number" id="amountPaid" value="0" min="0" style="width:140px;padding:10px;border:2px solid #e5e7eb;border-radius:6px;text-align:right;font-size:16px">
        </div>
        <div class="total-row final">
          <span>Balance Due:</span>
          <span id="balanceDue">₹0</span>
        </div>
      </div>

      <button class="btn-save" id="saveInvoiceBtn">Save Invoice</button>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    let currentSession = null
    let items = [{ name: '', qty: 1, price: 0 }]

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
      if (session) {
        currentSession = session
        document.getElementById('userEmail').innerText = session.user.email
      }
    })

    async function initApp() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return window.location.replace('/login.html')
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email

      const today = new Date()
      document.getElementById('invoiceDate').value = today.toLocaleDateString('en-GB')

      renderItems()
      calculateTotals()
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.replace('/login.html')
    }

    document.getElementById('addItemBtn').onclick = () => {
      items.push({ name: '', qty: 1, price: 0 })
      renderItems()
    }

    function renderItems() {
      const container = document.getElementById('itemsContainer')
      container.innerHTML = items.map((item, idx) => `
        <div class="item-row">
          <input type="text" placeholder="Item name" value="${item.name}" data-idx="${idx}" data-field="name">
          <input type="number" placeholder="1" value="${item.qty}" min="1" data-idx="${idx}" data-field="qty">
          <input type="number" placeholder="0" value="${item.price}" min="0" data-idx="${idx}" data-field="price">
          <input type="text" value="₹${(item.qty * item.price).toLocaleString('en-IN')}" readonly style="background:#f9fafb">
          ${items.length > 1? `<button class="btn-remove" data-idx="${idx}">×</button>` : '<div></div>'}
        </div>
      `).join('')

      container.querySelectorAll('input[data-field]').forEach(input => {
        input.oninput = (e) => {
          const idx = parseInt(e.target.dataset.idx)
          const field = e.target.dataset.field
          items[idx][field] = field === 'name'? e.target.value : Number(e.target.value)
          renderItems()
          calculateTotals()
        }
      })

      container.querySelectorAll('.btn-remove').forEach(btn => {
        btn.onclick = (e) => {
          const idx = parseInt(e.target.dataset.idx)
          items.splice(idx, 1)
          renderItems()
          calculateTotals()
        }
      })
    }

    function calculateTotals() {
      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0)
      const amountPaid = Number(document.getElementById('amountPaid').value) || 0
      const balanceDue = subtotal - amountPaid

      document.getElementById('subtotal').innerText = `₹${subtotal.toLocaleString('en-IN')}`
      document.getElementById('balanceDue').innerText = `₹${balanceDue.toLocaleString('en-IN')}`
    }

    document.getElementById('amountPaid').oninput = calculateTotals
    document.getElementById('paymentMode').onchange = () => {
      const mode = document.getElementById('paymentMode').value
      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0)
      if (mode === 'Udhar') {
        document.getElementById('amountPaid').value = 0
      } else {
        document.getElementById('amountPaid').value = subtotal
      }
      calculateTotals()
    }

    document.getElementById('saveInvoiceBtn').onclick = async () => {
      const customerName = document.getElementById('customerName').value.trim()
      if (!customerName) {
        alert('Customer name is required!')
        return
      }

      if (items.some(item =>!item.name || item.qty <= 0 || item.price < 0)) {
        alert('Please fill all item details correctly!')
        return
      }

      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0)
      const amountPaid = Number(document.getElementById('amountPaid').value) || 0
      const balanceDue = subtotal - amountPaid

      const btn = document.getElementById('saveInvoiceBtn')
      btn.disabled = true
      btn.innerText = 'Saving...'

      try {
        let customerId = null
        const customerPhone = document.getElementById('customerPhone').value.trim()

        if (customerPhone) {
          const { data: existingCustomer } = await supabase
          .from('customers')
          .select('id')
          .eq('user_id', currentSession.user.id)
          .eq('phone', customerPhone)
          .single()

          if (existingCustomer) {
            customerId = existingCustomer.id
          } else {
            const { data: newCustomer } = await supabase
            .from('customers')
            .insert({
                user_id: currentSession.user.id,
                name: customerName,
                phone: customerPhone
              })
            .select()
            .single()
            customerId = newCustomer.id
          }
        }

        const today = new Date().toISOString().split('T')[0]
        const { data: invoice, error: invoiceError } = await supabase
        .from('invoices')
        .insert({
            user_id: currentSession.user.id,
            customer_id: customerId,
            customer_name: customerName,
            date: today,
            total_amount: subtotal,
            amount_paid: amountPaid,
            balance_due: balanceDue,
            payment_mode: document.getElementById('paymentMode').value
          })
        .select()
        .single()

        if (invoiceError) throw invoiceError

        const invoiceItems = items.map(item => ({
          invoice_id: invoice.id,
          item_name: item.name,
          quantity: item.qty,
          price: item.price,
          total: item.qty * item.price
        }))

        const { error: itemsError } = await supabase
        .from('invoice_items')
        .insert(invoiceItems)

        if (itemsError) throw itemsError

        alert('Invoice saved successfully!')
        window.location.href = '/dashboard.html'

      } catch (error) {
        console.error('Error:', error)
        alert('Error saving invoice: ' + error.message)
        btn.disabled = false
        btn.innerText = 'Save Invoice'
      }
    }

    initApp()
  </script>
</body>
</html>
