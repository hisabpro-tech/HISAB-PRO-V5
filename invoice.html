<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Invoice - HISAB PRO V5</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5}

    /* Navbar - Customers page jaisa */
.navbar{background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-wrap:wrap}
.nav-brand{color:#fff;font-size:18px;font-weight:700;padding:12px 0;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{color:#d1fae5;text-decoration:none;padding:14px 12px;display:block;font-weight:500;font-size:14px;transition:all.2s;white-space:nowrap}
.nav-link:hover{background:#15803d;color:#fff}
.nav-link.active{background:#15803d;color:#fff}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px 0}
    #userEmail{color:#d1fae5;font-size:12px;display:none}
.btn-logout{background:#dc2626;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}

.container{max-width:900px;margin:0 auto;padding:20px 16px}
.page-title{font-size:24px;font-weight:700;margin-bottom:20px;color:#111827}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column}
.form-group label{margin-bottom:6px;font-weight:600;font-size:14px;color:#333}
.form-group input,.form-group select{padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.items-section h3{margin-bottom:16px;color:#333}
.items-header{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 50px;gap:12px;padding:12px 0;font-weight:600;border-bottom:2px solid #eee;margin-bottom:12px;color:#555;font-size:14px}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 50px;gap:12px;margin-bottom:12px;align-items:center}
.item-name-wrapper{position:relative}
.item-row input{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box;font-size:14px}
.item-total{text-align:right;font-weight:600;padding:10px;color:#333}
.btn-remove-item{background:#dc2626;color:#fff;border:none;border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:18px;font-weight:700}
.btn-remove-item:hover{background:#b91c1c}
.stock-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;max-height:200px;overflow-y:auto;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
.stock-dropdown.show{display:block}
.stock-item{padding:12px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.stock-item:hover{background:#f5f5f5}
.stock-item-name{font-weight:600;color:#333;margin-bottom:4px}
.stock-item-details{font-size:12px;color:#666}
.stock-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.stock-badge.ok{background:#d4edda;color:#155724}
.stock-badge.low{background:#fff3cd;color:#856404}
.btn-add-item{width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700;margin-top:12px}
.btn-add-item:hover{background:#15803d}
.totals-section{border-top:2px solid #eee;padding-top:16px;margin-top:20px}
.total-row{display:flex;justify-content:space-between;padding:10px 0;font-size:16px;color:#555}
.total-row.grand{font-size:20px;font-weight:700;color:#16a34a;border-top:2px solid #eee;margin-top:12px;padding-top:16px}
.action-buttons{display:flex;gap:12px;margin-top:20px}
.btn-save{flex:1;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
.btn-save:hover{background:#15803d}
.btn-save:disabled{background:#9ca3af;cursor:not-allowed}

    @media (max-width:768px){
.nav-container{padding:0 8px}
.nav-brand{font-size:16px;padding:10px 0}
.nav-links{width:100%;order:3;padding-bottom:4px}
.nav-link{padding:12px 10px;font-size:13px}
.btn-logout{padding:6px 10px;font-size:12px}
.form-row{grid-template-columns:1fr}
.items-header{display:none}
.item-row{grid-template-columns:1fr;gap:8px;padding:12px;background:#f9fafb;border-radius:8px}
.item-total{text-align:left}
    }
  </style>
</head>
<body>
  <!-- Navbar - Customers page jaisa -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">HISAB PRO V5</div>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/invoice.html" class="nav-link active">New Invoice</a>
        <a href="/stock.html" class="nav-link">Stock</a>
        <a href="/customers.html" class="nav-link">Customers</a>
        <a href="/reports.html" class="nav-link">Reports</a>
        <a href="/downloads.html" class="nav-link">Downloads</a>
      </div>
      <div class="nav-user">
        <span id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">New Invoice</h1>

    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label>Customer Name *</label>
          <input type="text" id="customerName" placeholder="Enter customer name" required>
        </div>
        <div class="form-group">
          <label>Customer Phone</label>
          <input type="tel" id="customerPhone" placeholder="Enter phone number">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Invoice Date</label>
          <input type="date" id="invoiceDate" required>
        </div>
        <div class="form-group">
          <label>Payment Mode</label>
          <select id="paymentMode">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="Udhar">Udhar (Credit)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card items-section">
      <h3>Items</h3>
      <div class="items-header">
        <div>Item Name</div>
        <div>Qty</div>
        <div>Price</div>
        <div>Total</div>
        <div></div>
      </div>

      <div id="itemsList">
        <div class="item-row" id="blankRow">
          <div class="item-name-wrapper">
            <input type="text" placeholder="Item name" class="item-name" value="" autocomplete="off">
            <div class="stock-dropdown"></div>
          </div>
          <input type="number" placeholder="Qty" class="item-qty" min="1">
          <input type="number" placeholder="Price" class="item-price" min="0">
          <div class="item-total">₹0</div>
          <button type="button" class="btn-remove-item" style="visibility:hidden">×</button>
        </div>
      </div>

      <button type="button" id="addItemBtn" class="btn-add-item">+ Add Item</button>
    </div>

    <div class="card">
      <div class="totals-section">
        <div class="total-row">
          <span>Subtotal:</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="total-row">
          <span>Amount Paid:</span>
          <input type="number" id="amountPaid" value="0" min="0" style="width:150px;text-align:right;padding:8px;border:1px solid #ddd;border-radius:6px;">
        </div>
        <div class="total-row grand">
          <span>Balance Due:</span>
          <span id="balanceDue">₹0</span>
        </div>
      </div>

      <div class="action-buttons">
        <button type="button" id="saveBtn" class="btn-save">Save Invoice</button>
      </div>
    </div>
  </div>

<script type="module">
  import { supabase } from './js/supabaseClient.js'

  let currentSession = null
  let stockItems = []

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') return window.location.replace('/login.html')
    if (session) {
      currentSession = session
      document.getElementById('userEmail').innerText = session.user.email
      loadStock()
    }
  })

  async function initApp() {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) return window.location.replace('/login.html')
    currentSession = session
    document.getElementById('userEmail').innerText = session.user.email
    document.getElementById('invoiceDate').value = new Date().toISOString().split('T')[0]
    await loadStock()
  }

  document.getElementById('logoutBtn').onclick = async () => {
    await supabase.auth.signOut()
    window.location.replace('/login.html')
  }

  async function loadStock() {
    console.log('Loading stock...')
    const { data, error } = await supabase
.from('stock')
.select('*')
.eq('user_id', currentSession.user.id)
.order('item_name')

    if (error) {
      console.error('Stock load error:', error)
      alert('Stock load failed: ' + error.message)
      return
    }

    stockItems = data || []
    console.log('Stock loaded:', stockItems.length, 'items', stockItems)
    window.stockItems = stockItems

    attachItemListeners()
  }

  function attachItemListeners() {
    console.log('Attaching listeners with', stockItems.length, 'stock items')

    document.querySelectorAll('.item-row').forEach((row) => {
      const nameInput = row.querySelector('.item-name')
      const qtyInput = row.querySelector('.item-qty')
      const priceInput = row.querySelector('.item-price')
      const totalDiv = row.querySelector('.item-total')
      const removeBtn = row.querySelector('.btn-remove-item')
      const dropdown = row.querySelector('.stock-dropdown')

      const newNameInput = nameInput.cloneNode(true)
      nameInput.parentNode.replaceChild(newNameInput, nameInput)

      const updateRowTotal = () => {
        const qty = Number(qtyInput.value) || 1
        const price = Number(priceInput.value) || 0
        totalDiv.innerText = `₹${(qty * price).toLocaleString('en-IN')}`
        calculateTotal()
      }

      newNameInput.oninput = (e) => {
        const query = e.target.value.trim().toLowerCase()
        console.log('Typing:', query, 'Stock count:', stockItems.length)

        if (query.length < 1) {
          dropdown.classList.remove('show')
          return
        }

        const matches = stockItems.filter(item =>
          item.item_name.toLowerCase().includes(query)
        )

        console.log('Found matches:', matches.length)

        if (matches.length === 0) {
          dropdown.classList.remove('show')
          return
        }

        dropdown.innerHTML = matches.map(item => {
          const badge = item.quantity < 5? 'low' : 'ok'
          return `
            <div class="stock-item" data-name="${item.item_name}" data-price="${item.selling_price}" data-qty="${item.quantity}">
              <div class="stock-item-name">${item.item_name}</div>
              <div class="stock-item-details">
                Price: ₹${item.selling_price} |
                <span class="stock-badge ${badge}">Stock: ${item.quantity}</span>
              </div>
            </div>
          `
        }).join('')

        dropdown.classList.add('show')

        dropdown.querySelectorAll('.stock-item').forEach(item => {
          item.onclick = () => {
            console.log('Selected:', item.dataset.name, 'Price:', item.dataset.price)
            newNameInput.value = item.dataset.name
            priceInput.value = item.dataset.price
            qtyInput.value = 1
            dropdown.classList.remove('show')
            updateRowTotal()
            qtyInput.focus()
          }
        })
      }

      newNameInput.onblur = () => {
        setTimeout(() => dropdown.classList.remove('show'), 200)
      }

      qtyInput.onfocus = (e) => {
        if (e.target.value === '0' || e.target.value === '') e.target.value = ''
        e.target.select()
      }

      priceInput.onfocus = (e) => {
        if (e.target.value === '0' || e.target.value === '') e.target.value = ''
        e.target.select()
      }

      qtyInput.oninput = updateRowTotal
      priceInput.oninput = updateRowTotal

      removeBtn.onclick = () => {
        if (row.id!== 'blankRow') {
          row.remove()
          calculateTotal()
        }
      }
    })
  }

  function addItemRow() {
    const blankRow = document.getElementById('blankRow')
    const blankName = blankRow.querySelector('.item-name').value.trim()
    const blankQty = Number(blankRow.querySelector('.item-qty').value) || 0
    const blankPrice = Number(blankRow.querySelector('.item-price').value) || 0

    if (blankName || blankQty > 0 || blankPrice > 0) {
      blankRow.querySelector('.btn-remove-item').style.visibility = 'visible'
      blankRow.removeAttribute('id')

      const newBlankHTML = `
        <div class="item-row" id="blankRow">
          <div class="item-name-wrapper">
            <input type="text" placeholder="Item name" class="item-name" value="" autocomplete="off">
            <div class="stock-dropdown"></div>
          </div>
          <input type="number" placeholder="Qty" class="item-qty" min="1">
          <input type="number" placeholder="Price" class="item-price" min="0">
          <div class="item-total">₹0</div>
          <button type="button" class="btn-remove-item" style="visibility:hidden">×</button>
        </div>
      `
      document.getElementById('itemsList').insertAdjacentHTML('afterbegin', newBlankHTML)
    } else {
      const itemHTML = `
        <div class="item-row">
          <div class="item-name-wrapper">
            <input type="text" placeholder="Item name" class="item-name" value="" autocomplete="off">
            <div class="stock-dropdown"></div>
          </div>
          <input type="number" placeholder="Qty" class="item-qty" min="1">
          <input type="number" placeholder="Price" class="item-price" min="0">
          <div class="item-total">₹0</div>
          <button type="button" class="btn-remove-item">×</button>
        </div>
      `
      blankRow.insertAdjacentHTML('afterend', itemHTML)
    }

    attachItemListeners()
    calculateTotal()
  }

  function calculateTotal() {
    let subtotal = 0
    document.querySelectorAll('.item-row').forEach(row => {
      const qty = Number(row.querySelector('.item-qty').value) || 1
      const price = Number(row.querySelector('.item-price').value) || 0
      subtotal += qty * price
    })

    const amountPaid = Number(document.getElementById('amountPaid').value) || 0
    const balanceDue = subtotal - amountPaid

    document.getElementById('subtotal').innerText = `₹${subtotal.toLocaleString('en-IN')}`
    document.getElementById('balanceDue').innerText = `₹${balanceDue.toLocaleString('en-IN')}`
  }

  document.getElementById('addItemBtn').onclick = () => addItemRow()

  document.getElementById('amountPaid').onfocus = (e) => {
    if (e.target.value === '0') e.target.value = ''
    e.target.select()
  }

  document.getElementById('amountPaid').oninput = calculateTotal

  document.getElementById('paymentMode').onchange = (e) => {
    if (e.target.value === 'Udhar') {
      document.getElementById('amountPaid').value = ''
      calculateTotal()
    }
  }

  document.getElementById('saveBtn').onclick = async () => {
    const customerName = document.getElementById('customerName').value.trim()
    const customerPhone = document.getElementById('customerPhone').value.trim()
    const invoiceDate = document.getElementById('invoiceDate').value
    const paymentMode = document.getElementById('paymentMode').value
    const amountPaid = Number(document.getElementById('amountPaid').value) || 0

    if (!customerName) {
      alert('Please enter customer name')
      return
    }

    const items = []
    let subtotal = 0
    const stockUpdates = []

    document.querySelectorAll('.item-row').forEach(row => {
      const name = row.querySelector('.item-name').value.trim()
      const qty = Number(row.querySelector('.item-qty').value) || 1
      const price = Number(row.querySelector('.item-price').value) || 0
      if (name && qty > 0) {
        items.push({ name, qty, price })
        subtotal += qty * price

        const stockItem = stockItems.find(s =>
          s.item_name.trim().toLowerCase() === name.toLowerCase()
        )

        if (stockItem) {
          console.log(`Found in stock: ${stockItem.item_name}, Available: ${stockItem.quantity}, Selling: ${qty}`)
          if (stockItem.quantity < qty) {
            alert(`Insufficient stock for ${name}. Available: ${stockItem.quantity}, Required: ${qty}`)
            throw new Error('Insufficient stock')
          }
          stockUpdates.push({
            id: stockItem.id,
            name: stockItem.item_name,
            oldQty: stockItem.quantity,
            newQty: stockItem.quantity - qty
          })
        } else {
          console.warn(`Item "${name}" not found in stock - skipping stock update`)
        }
      }
    })

    if (items.length === 0) {
      alert('Please add at least one item')
      return
    }

    const balanceDue = subtotal - amountPaid

    document.getElementById('saveBtn').disabled = true
    document.getElementById('saveBtn').innerText = 'Saving...'

    try {
      console.log('Stock updates to apply:', stockUpdates)

      let { data: customer } = await supabase
.from('customers')
.select('id')
.eq('user_id', currentSession.user.id)
.eq('name', customerName)
.single()

      if (!customer) {
        const { data: newCustomer, error: custError } = await supabase
  .from('customers')
  .insert({
            user_id: currentSession.user.id,
            name: customerName,
            phone: customerPhone || null
          })
  .select()
  .single()

        if (custError) throw custError
        customer = newCustomer
      }

      const { data: invoice, error: invError } = await supabase
.from('invoices')
.insert({
          user_id: currentSession.user.id,
          customer_id: customer.id,
          customer_name: customerName,
          date: invoiceDate,
          payment_type: paymentMode,
          total_amount: subtotal,
          amount_paid: amountPaid,
          balance_due: balanceDue
        })
.select()
.single()

      if (invError) throw invError
      console.log('Invoice created:', invoice.id)

      const invoiceItems = items.map(item => ({
        invoice_id: invoice.id,
        item_name: item.name,
        quantity: item.qty,
        price: item.price,
        total: item.qty * item.price
      }))

      const { error: itemsError } = await supabase.from('invoice_items').insert(invoiceItems)
      if (itemsError) throw itemsError
      console.log('Invoice items saved')

      for (const update of stockUpdates) {
        console.log(`Updating ${update.name}: ${update.oldQty} -> ${update.newQty}`)

        const { data, error: stockError } = await supabase
  .from('stock')
  .update({ quantity: update.newQty })
  .eq('id', update.id)
  .select()

        if (stockError) {
          console.error(`Stock update failed for ${update.name}:`, stockError)
          alert(`Stock update failed: ${stockError.message}`)
          throw stockError
        }
        console.log(`Stock updated successfully for ${update.name}:`, data)
      }

      alert('Invoice saved successfully! Stock updated.')
      window.location.reload()

    } catch (error) {
      console.error('Save error:', error)
      if (error.message!== 'Insufficient stock') {
        alert('Error saving invoice: ' + error.message)
      }
      document.getElementById('saveBtn').disabled = false
      document.getElementById('saveBtn').innerText = 'Save Invoice'
    }
  }

  initApp()
</script>
</body>
</html>
